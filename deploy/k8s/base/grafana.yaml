apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  # Mirrors apps/observability/grafana/provisioning/datasources/*.yml —
  # kustomize's file-based configMapGenerator can't reach outside
  # deploy/k8s/base (security restrictor), so this is copied rather than
  # generated; keep it in sync if those files change.
  clickhouse.yml: |
    apiVersion: 1

    deleteDatasources:
      - name: DataHarbor-ClickHouse
        orgId: 1

    datasources:
      - name: DataHarbor-ClickHouse
        type: grafana-clickhouse-datasource
        uid: DataHarbor-ClickHouse
        access: proxy
        isDefault: false
        jsonData:
          host: clickhouse
          port: 9000
          username: default
          password: ""
          defaultDatabase: default
          protocol: native
  postgres.yml: |
    apiVersion: 1

    deleteDatasources:
      - name: DataHarbor-PostgreSQL
        orgId: 1

    datasources:
      - name: DataHarbor-PostgreSQL
        uid: DataHarbor-PostgreSQL
        type: postgres
        access: proxy
        url: postgres:5432
        user: ${POSTGRES_USER}
        secureJsonData:
          password: ${POSTGRES_PASSWORD}
        jsonData:
          database: ${POSTGRES_DB}
          sslmode: disable
          postgresVersion: 1600
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
data:
  # Mirrors apps/observability/grafana/provisioning/dashboards/dashboards.yml
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: DataHarbor-Core-Dashboards
        folder: DataHarbor Platform
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json

      - name: DataHarbor-Bundle-Dashboards
        folder: DataHarbor Bundles
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/bundles
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-enterprise:latest
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-clickhouse-datasource"
            # The postgres datasource provisioning file interpolates these
            # (${POSTGRES_USER} etc.) the same way Compose's env_file: .env does.
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            # Per-bundle dashboard JSON isn't part of the open-core repo (it
            # ships with private bundle installs) — mount empty, writable
            # dirs at the paths dashboards.yml's providers point at instead
            # of failing to start with no source for them.
            - name: dashboards-json
              mountPath: /etc/grafana/provisioning/dashboards/json
            - name: dashboards-bundles
              mountPath: /etc/grafana/provisioning/dashboards/bundles
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboards-json
          emptyDir: {}
        - name: dashboards-bundles
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
