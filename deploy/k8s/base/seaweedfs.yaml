apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels:
    app: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args: ["server", "-s3", "-dir=/data"]
          ports:
            - containerPort: 8333
            - containerPort: 9333
          # -dir=/data had no volumeMount/PVC — every uploaded S3 object was
          # lost on pod restart or reschedule, unlike every other stateful
          # service here (postgres/clickhouse/qdrant all mount a PVC).
          volumeMounts:
            - name: seaweedfs-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: seaweedfs-storage
          persistentVolumeClaim:
            claimName: seaweedfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-service
  labels:
    app: seaweedfs
spec:
  ports:
    - name: s3-api
      port: 8333
      targetPort: 8333
    - name: master-ui
      port: 9333
      targetPort: 9333
  selector:
    app: seaweedfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
