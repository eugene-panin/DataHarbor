name: Bug report
description: Something in the platform, a bundle scaffold, or the CLI isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security issue instead? Please use a private
        [Security Advisory](https://github.com/eugene-panin/DataHarbor/security/advisories/new)
        instead of a public issue — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the exact `harbor ...` command if relevant.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps from a fresh `git clone`, if possible.
      placeholder: |
        1. `harbor up --compose`
        2. `harbor bundle run demo`
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste the exact error, traceback, or `docker compose logs` output. This will be rendered as a code block.
      render: shell

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: docker-compose, Tilt/Kind, or bare host?
      placeholder: docker-compose

  - type: input
    id: version
    attributes:
      label: DataHarbor version / commit
      description: Output of `uv run harbor --version` or the commit SHA you're on.

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15 / Ubuntu 24.04 / ...

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
