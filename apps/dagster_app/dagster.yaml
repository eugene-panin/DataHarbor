# Dagster Instance Configuration with Auto-Reconciliation for Orphaned Runs
run_monitoring:
  enabled: true
  start_timeout_seconds: 120
  cancel_timeout_seconds: 60
  poll_interval_seconds: 30

telemetry:
  enabled: false

# Any asset that declares a Dagster pool gets one concurrent run by default.
# The AfterShip bundle uses ``aftership_directory`` so all country partitions
# share a single slot and cannot make concurrent requests to that source.
concurrency:
  pools:
    default_limit: 1
    granularity: run
