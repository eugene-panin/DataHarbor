apiVersion: 1

deleteDatasources:
  - name: DataHarbor-PostgreSQL
    orgId: 1

datasources:
  - name: DataHarbor-PostgreSQL
    uid: DataHarbor-PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: true
