[project]
name = "dataharbor"
version = "1.0.0"
description = "Modular open-core data platform with autonomous scraper self-healing (ClickHouse, Qdrant, Dagster, AI-driven remediation)"
authors = [{ name = "Eugene Panin" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "web-scraping",
    "data-platform",
    "etl",
    "dagster",
    "clickhouse",
    "self-healing",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "aioboto3==13.0.1",
    "psycopg2-binary>=2.9.9",
    "clickhouse-connect>=0.7.0",
    "qdrant-client>=1.9.0",
    "boto3>=1.34.0",
    "beautifulsoup4>=4.12.3",
    "dagster>=1.6.5",
    "dagster-webserver>=1.6.5",
    "dagster-postgres>=0.23.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/eugene-panin/DataHarbor"
Repository = "https://github.com/eugene-panin/DataHarbor"
Issues = "https://github.com/eugene-panin/DataHarbor/issues"
Changelog = "https://github.com/eugene-panin/DataHarbor/commits/main"

[project.scripts]
harbor = "apps.cli.main:app"

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "faster-whisper>=1.0.0",
    "easyocr>=1.7.0",
    "sentence-transformers>=2.2.0",
    "hdbscan>=0.8.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]
analytics = [
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "rapidfuzz>=3.0.0",
    "python-stdnum>=1.19",
    "openpyxl>=3.1.0",
]
crawl = [
    "duckdb>=1.0.0",
    "warcio>=1.7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "bundles*", "extractors*"]
exclude = ["tests*", "analysis*", "deploy*", "output*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["apps", "bundles", "extractors", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "bundles", "extractors"]

[tool.pytest.ini_options]
testpaths = ["tests", "extractors/demo_site/tests", "bundles/demo/tests"]
pythonpath = ["."]
