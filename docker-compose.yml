services:
  # 1. PostgreSQL Database (Relational storage & UPSERT sink)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dataharbor_postgres
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dataharbor}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:54320:5432"  # loopback-only: no auth hardening beyond POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 2. Dagster Webserver & Orchestrator
  dagster:
    build: .
    container_name: dataharbor_dagster
    # Bind-mounting .:/app would hide the image .venv (host macOS venv ≠ Linux).
    # Keep Linux deps in a named volume; sync crawl extra on start for store_intel/WARC.
    command: >
      sh -c "uv sync --frozen --no-dev --extra crawl
      && mkdir -p /opt/dagster/dagster_home
      && cp apps/dagster_app/dagster.yaml /opt/dagster/dagster_home/dagster.yaml
      && cd /opt/dagster
      && PYTHONPATH=/app python -m apps.dagster_app.run_dev"
    ports:
      - "127.0.0.1:3000:3000"  # Dagster webserver has no auth of its own
    env_file:
      - .env
    environment:
      - S3_ENDPOINT_URL=http://seaweedfs:8333
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dataharbor}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_LIST=${PROXY_LIST:-}
      - RESIDENTIAL_PROXY_URL=${RESIDENTIAL_PROXY_URL:-}
      - RESIDENTIAL_PROXY_LIST=${RESIDENTIAL_PROXY_LIST:-}
      - DATACENTER_PROXY_URL=${DATACENTER_PROXY_URL:-}
      - DATACENTER_PROXY_LIST=${DATACENTER_PROXY_LIST:-}
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DAGSTER_WORKSPACE_NAME=${DAGSTER_WORKSPACE_NAME:-all}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-dataharbor}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - N8N_ALERT_WEBHOOK_URL=${N8N_ALERT_WEBHOOK_URL:-}
    volumes:
      - .:/app
      - dagster_venv:/app/.venv
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      qdrant:
        condition: service_started
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # 3. SeaweedFS (S3 Object Storage, Master UI & Filer)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: dataharbor_seaweedfs
    command: "server -s3 -filer -dir=/data"
    ports:
      - "127.0.0.1:8334:8333"  # S3 API Host Port — no auth
      - "127.0.0.1:9334:9333"  # Master Web UI Host Port
      - "127.0.0.1:8888:8888"  # Interactive Web Filer Explorer
    volumes:
      - seaweed_data:/data
    restart: unless-stopped

  # 4. n8n (optional profile). Keys are appended to `.env` by
  # `harbor up --compose --with-n8n` — they are not in `.env.example`.
  n8n:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: dataharbor_n8n
    env_file:
      - .env
    ports:
      - "127.0.0.1:56780:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:56780/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=${N8N_INSTANCE_OWNER_EMAIL:-}
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=${N8N_INSTANCE_OWNER_PASSWORD_HASH:-}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${N8N_INSTANCE_OWNER_FIRST_NAME:-Admin}
      - N8N_INSTANCE_OWNER_LAST_NAME=${N8N_INSTANCE_OWNER_LAST_NAME:-User}
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # 5. ClickHouse (OLAP Analytics Warehouse)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: dataharbor_clickhouse
    env_file:
      - .env
    ports:
      - "127.0.0.1:8123:8123"  # HTTP Interface
      - "127.0.0.1:9000:9000"  # Native Client Interface
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - ./apps/clickhouse/users.d/dataharbor-admin.xml:/etc/clickhouse-server/users.d/dataharbor-admin.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 6. Qdrant (Vector search / RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dataharbor_qdrant
    env_file:
      - .env
    environment:
      # The app reads QDRANT_API_KEY as a client credential, but Qdrant itself
      # ignored it — the server accepted unauthenticated requests from anyone
      # who could reach the port regardless of this setting. This is what
      # actually turns QDRANT_API_KEY into server-side auth. Empty disables it,
      # matching the no-auth default when QDRANT_API_KEY is unset.
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"  # HTTP API
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 7. Grafana (Observability dashboards)
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: dataharbor_grafana
    env_file:
      - .env
    ports:
      # Grafana is an operator UI; keep it reachable from this host only.
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - ./apps/observability/grafana/provisioning:/etc/grafana/provisioning
      # Local-only: bundle dashboards from harbor bundle install (not in open-core git).
      - ./bundles:/etc/grafana/provisioning/dashboards/bundles:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 8. Demo site (static HTML fixture scraped by the bundled `demo` bundle)
  demo_site:
    image: nginx:alpine
    container_name: dataharbor_demo_site
    ports:
      - "127.0.0.1:8098:80"  # browse the fixture at http://localhost:8098
    volumes:
      - ./deploy/demo_site:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  seaweed_data:
  postgres_data:
  n8n_data:
  clickhouse_data:
  qdrant_data:
  grafana_data:
  dagster_venv:
  dagster_home:
